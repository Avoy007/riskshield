{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block page_title %}Customers{% endblock %}

{% block content %}

<div class="full-row">
  <div class="section-header">
    <div class="section-title">All Customers</div>
    <span class="section-count" id="customer-count">Loading…</span>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Accounts</th>
          <th>Total Balance</th>
        </tr>
      </thead>
      <tbody id="customers-tbody">
        <tr>
          <td colspan="6">
            <div class="skeleton" style="margin:20px;"></div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
